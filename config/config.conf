# ================= ERROR GUARD =================
ENGINE_TIMEOUT=20
ERROR_WARNING_LIMIT=2
ERROR_RECOVERY_LIMIT=3
ERROR_CRITICAL_LIMIT=5

# ================= TERMUX API =================
API_LOCATION_TIMEOUT=20
API_LOCATION_PROVIDER=gps
API_BATTERY_TIMEOUT=10
BATTERY_POLL_INTERVAL=30
BATTERY_ERROR_COOLDOWN=30
API_NETWORK_LOCATION_TIMEOUT=10
