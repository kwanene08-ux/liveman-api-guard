NETWORK_SCORE_GOOD_UNSTABLE=65
NETWORK_SCORE_WARNING_STABLE=70
NETWORK_SCORE_WARNING_VARIABLE=55
NETWORK_SCORE_WARNING_UNSTABLE=40
NETWORK_SCORE_BAD=40
