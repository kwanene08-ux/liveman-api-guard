VERSION="v12.1 WATCHDOG + API GUARD HARDENED"

# ================= CORE =================
INTERVAL=5
CACHE_MAX_AGE=600
MAX_CONSECUTIVE_ERRORS=10
LOG_MAX_LINES=5000

# ================= API =================
API_TIMEOUT=10
API_RETRIES=2

# ================= WATCHDOG =================
WATCHDOG_TIMEOUT=30
AUTO_RECOVERY=true

# ================= GPS =================
GPS_TIMEOUT=8
GPS_CACHE_MAX_AGE=300
GPS_ERROR_BACKOFF_1=2
GPS_ERROR_BACKOFF_2=5
GPS_ERROR_BACKOFF_3=10
GPS_CIRCUIT_THRESHOLD=5
GPS_CIRCUIT_COOLDOWN=30

# GPS authoritative / network fallback
GPS_PROBE_INTERVAL=15
GPS_NETWORK_POLL_INTERVAL=60
GPS_NETWORK_COOLDOWN=30
GPS_NETWORK_MAX_ACCURACY=80
GPS_NETWORK_TIMEOUT=5
GPS_RETRIES=1

# GPS jump protection
GPS_JUMP_METERS=100
GPS_JUMP_MAX_AGE=120
GPS_JUMP_MAX_SPEED_MPS=8

# ================= HEALTH =================
NETWORK_HISTORY_SIZE=10
HEALTH_EXCELLENT=90
HEALTH_GOOD=75
